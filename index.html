<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"></head><body><title>나의 7년, 1592</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 한 가지 화면만 쓰는 게임: 밤의 먹색 바탕 + 불씨 호박색 */
:root{
  --bg:#0E0D0C; --bg-2:#141210; --surface:#191715; --surface-2:#211E1B; --paper:#1C1916;
  --ink:#ECE4D6; --ink-2:#C9BFB0; --muted:#8E847A;
  --accent:#E0A15A; --accent-2:#F2C28A; --accent-soft:rgba(224,161,90,.12);
  --danger:#D8765C; --danger-soft:rgba(216,118,92,.13);
  --food:#CFA95F; --food-soft:rgba(207,169,95,.12);
  --health:#8DB8A6; --health-soft:rgba(141,184,166,.12);
  --line:#34302B; --line-soft:#26231F;
  --news:#A99F92;
  --shadow:0 18px 50px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{background:var(--bg)}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  font-size:16px; line-height:1.75; -webkit-font-smoothing:antialiased; min-height:100%}
body::before{content:""; position:fixed; inset:0; pointer-events:none; z-index:20;
  background:radial-gradient(ellipse 120% 90% at 50% 40%, transparent 55%, rgba(0,0,0,.55) 100%)}
body::after{content:""; position:fixed; inset:0; pointer-events:none; z-index:21; opacity:.18;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px)}
.wrap{max-width:820px; margin:0 auto; padding:0 16px; padding-block:18px 64px; position:relative; z-index:1}
h1,h2,h3{font-family:"Nanum Myeongjo","Gowun Batang","Noto Serif KR",serif; margin:0; text-wrap:balance; font-weight:800; letter-spacing:-.01em}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
button{font-family:inherit}
button:focus-visible,.story:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
.hl{color:var(--accent-2); font-weight:700}
.q{color:var(--accent-2)}

/* ---------- 장면 그림 ---------- */
.frame{position:relative; margin:0 0 18px; border-radius:2px; overflow:hidden; background:#000; box-shadow:var(--shadow)}
.frame::after{content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(180deg, rgba(14,13,12,0) 55%, rgba(14,13,12,.85) 100%), radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.45) 100%)}
.art{display:block; width:100%; height:auto; max-width:100%; aspect-ratio:960/400; object-fit:cover; animation:kb 14s ease-out both}
@keyframes kb{from{transform:scale(1.06)} to{transform:scale(1)}}
.frame .cap{position:absolute; left:18px; right:18px; bottom:12px; z-index:2; display:flex; justify-content:space-between; align-items:flex-end; gap:12px}
.frame .yr{font-family:"IBM Plex Mono",monospace; font-size:13px; letter-spacing:.14em; color:var(--accent)}
.frame .ttl{font-family:"Nanum Myeongjo",serif; font-weight:800; font-size:clamp(22px,4.4vw,32px); color:#F4ECDF; line-height:1.25; text-shadow:0 2px 12px rgba(0,0,0,.8)}

/* ---------- 첫 화면 ---------- */
.title-card{padding:0}
.title-card .frame{margin-bottom:26px}
.kicker{font-size:12px; letter-spacing:.24em; color:var(--muted); margin:0 0 12px; font-weight:500}
.title-card h1{font-size:clamp(40px,9vw,72px); line-height:1.05}
.title-card h1 .yr{font-family:"IBM Plex Mono",monospace; font-weight:500; color:var(--accent); font-size:.24em; letter-spacing:.3em; display:block; margin-bottom:14px}
.lede{margin:20px 0 0; color:var(--ink-2); max-width:58ch; font-family:"Gowun Batang",serif; font-size:17.5px; line-height:1.95}
.rules{margin:28px 0 0; padding:18px 0 0; list-style:none; display:grid; gap:10px; border-top:1px solid var(--line)}
.rules li{display:grid; grid-template-columns:34px 1fr; gap:8px; font-size:14.5px; color:var(--ink-2)}
.rules .n{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--accent); padding-top:3px}
.draw{margin-top:28px; display:flex; gap:12px; flex-wrap:wrap; align-items:center}
.btn{cursor:pointer; border-radius:2px; border:1px solid var(--line); background:transparent; color:var(--ink-2);
  padding:11px 18px; font-size:15px; font-weight:500; letter-spacing:.02em; transition:border-color .2s, background .2s, color .2s}
.btn:hover{border-color:var(--accent); color:var(--accent-2)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#1A1208; font-weight:700}
.btn.primary:hover{background:var(--accent-2); color:#1A1208}
.note-small{font-size:12.5px; color:var(--muted); margin-top:20px}
details.teacher{margin-top:16px; font-size:13px; color:var(--muted)}
details.teacher summary{cursor:pointer}
.pick{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.pick .btn{font-size:13px; padding:6px 12px}

/* ---------- 인물 소개 ---------- */
.reveal{position:relative}
.reveal .who{font-size:13px; color:var(--accent); letter-spacing:.14em}
.reveal h2{font-size:clamp(28px,5.5vw,40px); margin:8px 0 6px}
.reveal .where{font-size:14px; color:var(--muted); margin:0 0 18px; letter-spacing:.04em}
.reveal p.intro{margin:0 0 10px; font-family:"Gowun Batang",serif; font-size:18px; line-height:1.95; color:var(--ink)}
.famline{display:flex; flex-wrap:wrap; gap:6px; margin:18px 0 0}

/* ---------- 상태 ---------- */
.status{position:sticky; top:env(safe-area-inset-top,0px); z-index:15; background:rgba(20,18,16,.86); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  border:1px solid var(--line); border-radius:2px; padding:10px 14px; display:grid; gap:8px; margin-bottom:14px}
.status-top{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.status-top .nm{font-family:"Nanum Myeongjo",serif; font-weight:800; font-size:18px}
.chip{display:inline-flex; align-items:center; gap:4px; font-size:12px; padding:1px 9px; border-radius:999px; border:1px solid var(--line); color:var(--ink-2); background:var(--surface-2)}
.chip.status-chip{border-color:var(--accent); color:var(--accent-2); background:var(--accent-soft)}
.chip.place{border-style:dashed}
.meters{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
@media (max-width:560px){ .meters{grid-template-columns:1fr} }
.meter{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-2); min-width:0}
.meter .lab{width:34px; flex:none; font-weight:700; color:var(--muted)}
.pips{display:flex; gap:4px}
.pip{width:15px; height:6px; border-radius:1px; background:var(--line); transition:background .3s}
.meter.food .pip.on{background:var(--food)}
.meter.health .pip.on{background:var(--health)}
.fam{display:flex; flex-wrap:wrap; gap:4px}
.fam .p{font-size:12px; padding:0 8px; border-radius:999px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2)}
.fam .p.lost{text-decoration:line-through; opacity:.5; background:transparent}
.fam .p.apart{border-style:dashed}

.track{display:flex; gap:4px; margin:0 0 14px}
.track span{flex:1; height:2px; background:var(--line)}
.track span.done{background:var(--ink-2)}
.track span.now{background:var(--accent)}

.news{display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:start; font-size:13.5px; color:var(--news); padding:4px 2px 12px; margin-bottom:6px}
.news .tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.14em; border:1px solid var(--news); padding:0 7px; border-radius:1px; margin-top:3px; white-space:nowrap}

/* ---------- 이야기 ---------- */
.story{position:relative; outline:none}
.story .body{padding:0 4px; cursor:pointer}
.story p{margin:0 0 12px; font-family:"Gowun Batang",serif; font-size:18.5px; line-height:2; max-width:62ch}
.story p.line{animation:rise .6s ease-out both}
@keyframes rise{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
.tap{display:flex; align-items:center; gap:10px; margin:10px 4px 0; font-size:12.5px; color:var(--muted); letter-spacing:.08em}
.tap .dot{width:6px; height:6px; border-radius:50%; background:var(--accent); animation:blink 1.4s ease-in-out infinite}
.tap button{margin-left:auto; background:none; border:0; color:var(--muted); font-size:12.5px; cursor:pointer; text-decoration:underline; text-underline-offset:3px}
@keyframes blink{50%{opacity:.25}}
.upkeep{margin:0 4px 16px; padding:9px 12px; border-left:2px solid var(--food); background:var(--food-soft); font-size:14px; color:var(--ink-2)}
.upkeep.bad{border-color:var(--danger); background:var(--danger-soft)}
.rumor{margin:14px 4px 0; padding:12px 14px; border:1px solid var(--line); background:var(--bg-2); font-family:"Gowun Batang",serif; font-size:15px; color:var(--ink-2); line-height:1.85}
.rumor cite{display:block; font-family:"Noto Sans KR",sans-serif; font-style:normal; font-size:12px; margin-top:6px; color:var(--muted)}
.choices{display:grid; gap:10px; margin:22px 4px 0}
.choice{text-align:left; cursor:pointer; background:var(--surface); border:1px solid var(--line); border-radius:2px; padding:14px 16px; font-size:16.5px; color:var(--ink); line-height:1.6;
  transition:border-color .2s, background .2s, transform .2s; display:grid; grid-template-columns:30px 1fr; gap:8px; animation:rise .5s ease-out both}
.choice:hover{border-color:var(--accent); background:var(--surface-2); transform:translateX(3px)}
.choice .k{font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--accent); padding-top:3px}
.choice .risk{display:block; font-size:12.5px; color:var(--muted); margin-top:3px}

.result{margin:22px 4px 0; border-top:1px solid var(--line); padding-top:18px}
.luck{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; padding:2px 10px; border-radius:1px; margin-bottom:12px; letter-spacing:.06em}
.luck.good{background:var(--health-soft); color:var(--health)}
.luck.bad{background:var(--danger-soft); color:var(--danger)}
.result p.rt{font-family:"Gowun Batang",serif; font-size:18.5px; line-height:2; margin:0 0 14px}
.deltas{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px}
.d{font-size:12.5px; padding:2px 10px; border-radius:999px; border:1px solid var(--line); color:var(--ink-2)}
.d.plus{border-color:var(--health); color:var(--health)}
.d.minus{border-color:var(--danger); color:var(--danger)}
.d.info{border-color:var(--accent); color:var(--accent-2)}

/* ---------- 결말 ---------- */
.ending .code{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--muted); letter-spacing:.16em}
.ending h2{font-size:clamp(28px,5.5vw,40px); margin:8px 0 14px}
.ending p.et{font-family:"Gowun Batang",serif; font-size:18.5px; line-height:2; margin:0 0 12px; max-width:62ch}
.compare{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:22px 0}
@media (max-width:560px){ .compare{grid-template-columns:1fr} }
.cbox{border:1px solid var(--line); border-radius:2px; padding:14px 16px; background:var(--surface)}
.cbox h3{font-size:13px; font-family:"Noto Sans KR",sans-serif; font-weight:700; color:var(--muted); letter-spacing:.12em; margin-bottom:8px}
.cbox dl{margin:0; display:grid; grid-template-columns:60px 1fr; gap:4px 8px; font-size:14px}
.cbox dt{color:var(--muted)} .cbox dd{margin:0}
.src{margin:22px 0 0; padding:16px 18px; background:var(--bg-2); border:1px solid var(--line); font-family:"Gowun Batang",serif; font-size:16px; line-height:1.9; color:var(--ink-2)}
.src cite{display:block; font-family:"Noto Sans KR",sans-serif; font-style:normal; font-size:12px; color:var(--muted); margin-top:8px; text-align:right}

.timeline-wrap{margin-top:30px}
.timeline-wrap h3{font-size:22px; margin-bottom:6px}
.timeline-wrap .sub{font-size:13.5px; color:var(--muted); margin:0 0 12px}
.tl-scroll{overflow-x:auto}
table.tl{width:100%; border-collapse:collapse; font-size:14px; min-width:520px}
table.tl th{font-size:12px; letter-spacing:.1em; color:var(--muted); text-align:left; font-weight:500; padding:6px 8px; border-bottom:1px solid var(--line)}
table.tl td{padding:10px 8px; border-bottom:1px solid var(--line-soft); vertical-align:top; color:var(--ink-2)}
table.tl td.y{font-family:"IBM Plex Mono",monospace; font-size:12.5px; color:var(--accent); white-space:nowrap}
table.tl td.nw{color:var(--news); font-size:13px; width:34%}
table.tl td.me b{font-weight:700; color:var(--ink)}

.think{margin-top:28px; border-top:1px solid var(--line); padding-top:20px}
.think h3{font-size:20px; margin-bottom:12px}
.think ol{margin:0; padding-left:20px; display:grid; gap:10px; color:var(--ink-2)}
.others{margin-top:20px; font-size:14px; color:var(--ink-2)}
.actions{margin-top:24px; display:flex; flex-wrap:wrap; gap:10px}
.disclaim{margin-top:30px; font-size:12px; color:var(--muted); line-height:1.85}

.fade-in{animation:fi .5s ease-out}
@keyframes fi{from{opacity:0} to{opacity:1}}

.mystery{margin:22px 0 0; padding:18px 20px; border:1px solid var(--accent); background:var(--accent-soft); display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between}
.mystery p{margin:0; font-size:15px; color:var(--ink)}
.who-box{margin:22px 0 0; border:1px solid var(--line); background:var(--surface); padding:22px 20px 18px; animation:rise .7s ease-out both}
.who-box .lbl{font-size:12px; letter-spacing:.18em; color:var(--muted)}
.who-box .real{display:inline-block; margin-left:10px; font-size:11.5px; padding:1px 9px; border-radius:1px; background:var(--accent); color:#1A1208; font-weight:700; letter-spacing:.04em; vertical-align:middle}
.who-box .real.no{background:var(--surface-2); color:var(--ink-2)}
.who-box h3{font-size:clamp(28px,5vw,36px); margin:8px 0 12px; color:var(--accent-2)}
.who-box p{margin:0 0 10px; font-size:15.5px; line-height:1.85; color:var(--ink-2)}
.who-box .unsure{margin-top:12px; padding:10px 12px; border:1px dashed var(--line); font-size:13px; color:var(--muted)}
.who-box .unsure b{color:var(--danger)}
.who-box .match{margin-top:12px; font-size:14px; color:var(--ink)}
.star{color:var(--accent); font-weight:700}
.credit{font-size:11.5px; color:var(--muted); margin-top:8px}
/* ---------- 마지막 글쓰기 ---------- */
.write{margin-top:30px; border-top:1px solid var(--line); padding-top:22px}
.write .eyebrow{font-size:12px; letter-spacing:.18em; color:var(--accent)}
.write h3{font-size:clamp(24px,4.6vw,32px); margin:6px 0 10px}
.write .blank{display:inline-block; min-width:3.2em; border-bottom:2px solid var(--accent); color:var(--accent-2); text-align:center}
.write .lead{font-size:15.5px; color:var(--ink-2); margin:0 0 16px; max-width:62ch}
.ex{display:grid; gap:10px; margin:0 0 18px}
.ex .e{border:1px solid var(--line); background:var(--bg-2); padding:12px 14px; font-family:"Gowun Batang",serif; font-size:15.5px; line-height:1.85; color:var(--ink-2)}
.ex .e b{color:var(--accent-2)}
.ex .e .tagx{display:block; font-family:"Noto Sans KR",sans-serif; font-size:11.5px; letter-spacing:.14em; color:var(--muted); margin-bottom:4px}
.ex .e u{text-decoration:none; border-bottom:1px dashed var(--health); color:var(--ink)}
.rules2{list-style:none; margin:0 0 18px; padding:12px 14px; border:1px solid var(--accent); background:var(--accent-soft); display:grid; gap:6px; font-size:14.5px}
.rules2 li{display:grid; grid-template-columns:22px 1fr; gap:6px; align-items:start; color:var(--ink)}
.rules2 .ck{width:18px; height:18px; border-radius:50%; border:1.5px solid var(--muted); margin-top:3px; display:grid; place-items:center; font-size:11px; color:#1A1208}
.rules2 li.ok .ck{background:var(--health); border-color:var(--health)}
.rules2 li .how{display:block; font-size:12.5px; color:var(--muted)}
.rules2 li label{cursor:pointer}
.form{display:grid; gap:14px}
.row2{display:grid; grid-template-columns:160px 1fr; gap:12px}
@media (max-width:520px){ .row2{grid-template-columns:1fr} }
.fld{display:grid; gap:5px}
.fld label{font-size:13px; font-weight:700; color:var(--ink-2)}
.fld input,.fld textarea{width:100%; font:inherit; font-size:16px; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:2px; padding:10px 12px}
.fld textarea{min-height:150px; resize:vertical; line-height:1.8; font-family:"Gowun Batang",serif; font-size:17px}
.fld input:focus,.fld textarea:focus{outline:none; border-color:var(--accent)}
.fld .sub{font-size:12px; color:var(--muted)}
.fld.bad input,.fld.bad textarea{border-color:var(--danger)}
.sentence{display:flex; flex-wrap:wrap; align-items:center; gap:8px; font-family:"Gowun Batang",serif; font-size:19px}
.sentence input{width:11em; max-width:100%; font-family:"Gowun Batang",serif; font-size:18px; text-align:center}
.mini{background:none; border:1px dashed var(--line); color:var(--ink-2); font-size:12.5px; padding:4px 10px; cursor:pointer; border-radius:2px}
.mini:hover{border-color:var(--accent); color:var(--accent-2)}
.sendrow{display:flex; flex-wrap:wrap; gap:12px; align-items:center}
.msg{font-size:14px; color:var(--ink-2)}
.msg.good{color:var(--health)} .msg.bad{color:var(--danger)}
.locked{margin-top:26px; padding:14px 16px; border:1px dashed var(--line); color:var(--muted); font-size:14px}

/* ---------- 인물 얼굴·아이콘 ---------- */
.portrait{width:96px; height:96px; border-radius:50%; object-fit:cover; border:2px solid var(--accent); box-shadow:0 6px 20px rgba(0,0,0,.5); display:block; margin:0 0 12px}
.portrait.mono{display:grid; place-items:center; background:var(--surface-2); color:var(--accent-2); font-family:"Nanum Myeongjo",serif; font-weight:800; font-size:34px}
.status-top .face{width:30px; height:30px; border-radius:50%; object-fit:cover; border:1px solid var(--accent); align-self:center}
.ico{width:15px; height:15px; flex:none; vertical-align:-2px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.meter .lab{display:inline-flex; align-items:center; gap:4px; width:auto; min-width:48px}
.chip .ico{width:12px; height:12px}

/* ---------- 모둠 배정 ---------- */
.group{margin-top:26px; padding:16px 18px; border:1px solid var(--line); background:var(--bg-2); display:grid; gap:12px}
.group h3{font-size:18px}
.group .row{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center}
.group label{font-size:14px; color:var(--ink-2)}
.group select{font:inherit; font-size:16px; padding:8px 10px; background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:2px}
.seats{display:flex; gap:6px}
.seat{min-width:46px; cursor:pointer; font:inherit; font-size:16px; padding:8px 0; background:var(--surface); color:var(--ink-2); border:1px solid var(--line); border-radius:2px}
.seat[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#1A1208; font-weight:700}
.group .sub{font-size:12.5px; color:var(--muted)}
.mygroup{margin:22px 0 0; padding:14px 16px; border:1px dashed var(--line); display:grid; gap:6px; font-size:14px; color:var(--ink-2)}
.mygroup b{color:var(--ink)}
.mygroup .me{color:var(--accent-2)}

/* ---------- 가족 몫 고르기 ---------- */
.hunger .who-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin:18px 4px 0}
.fcard{cursor:pointer; text-align:left; font:inherit; background:var(--surface); border:1px solid var(--line); border-radius:2px; padding:14px; color:var(--ink); display:grid; gap:4px; transition:border-color .2s, transform .2s}
.fcard:hover{border-color:var(--accent); transform:translateY(-2px)}
.fcard b{font-family:"Nanum Myeongjo",serif; font-size:19px}
.fcard span{font-size:12.5px; color:var(--muted)}
.fcard.weak span{color:var(--danger)}
.fcard.me{border-style:dashed}
.fam .p.weak{border-color:var(--danger); color:var(--danger)}
.fam .p.lost.just{animation:strike 1.6s ease-out both}
@keyframes strike{0%{text-decoration-color:transparent; opacity:1; background:var(--danger-soft)} 60%{opacity:1} 100%{text-decoration-color:currentColor; opacity:.5; background:transparent}}

/* ---------- 긴박한 순간 ---------- */
.timer{margin:18px 4px 0; display:grid; gap:6px}
.timer .lbl{display:flex; justify-content:space-between; font-size:13px; color:var(--danger); letter-spacing:.06em; font-weight:700}
.timer .bar{height:4px; background:var(--line); overflow:hidden}
.timer .bar i{display:block; height:100%; background:var(--danger); transform-origin:left; transition:transform .25s linear}
.timeout-note{display:inline-block; margin-bottom:8px; font-size:12.5px; color:var(--danger)}

/* ---------- 제비 뽑기 연출 ---------- */
.lot{position:fixed; inset:0; z-index:40; display:grid; place-items:center; background:rgba(8,7,6,.72); cursor:pointer}
.lot .slip{width:min(300px,76vw); padding:26px 20px; background:#E8DDC8; color:#221A12; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.6);
  font-family:"Nanum Myeongjo",serif; font-weight:800; font-size:26px; letter-spacing:.04em; transform-origin:50% 0; animation:slipIn .5s ease-out both}
.lot .slip small{display:block; font-family:"Noto Sans KR",sans-serif; font-weight:500; font-size:12px; letter-spacing:.2em; color:#6B5B48; margin-bottom:10px}
.lot .slip.shake{animation:slipShake .7s ease-in-out both}
.lot .slip.open{animation:slipOpen .45s ease-out both}
.lot .slip.good{border-top:4px solid #3E7A62}
.lot .slip.bad{border-top:4px solid #9C3B2E}
@keyframes slipIn{from{opacity:0; transform:translateY(-20px) scaleY(.2)} to{opacity:1; transform:none}}
@keyframes slipShake{0%,100%{transform:rotate(0)} 20%{transform:rotate(-4deg)} 40%{transform:rotate(3deg)} 60%{transform:rotate(-2deg)} 80%{transform:rotate(1deg)}}
@keyframes slipOpen{from{transform:scaleY(.15)} to{transform:scaleY(1)}}

/* ---------- 건강에 따라 흐려지는 장면 ---------- */
#app .art{transition:filter 1.2s ease}
#app[data-hp="3"] .art{filter:saturate(.7) brightness(.95)}
#app[data-hp="2"] .art{filter:grayscale(.55) brightness(.85) blur(.4px)}
#app[data-hp="1"] .art{filter:grayscale(.85) brightness(.7) blur(1px)}
#app[data-hp="0"] .art{filter:grayscale(1) brightness(.6) blur(1.4px)}
#app[data-hp="1"] .frame::after,#app[data-hp="0"] .frame::after{background:linear-gradient(180deg, rgba(14,13,12,0) 40%, rgba(14,13,12,.9) 100%), radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.7) 100%)}

/* ---------- 소리 ---------- */
.snd{position:fixed; right:max(12px, env(safe-area-inset-right,0px)); bottom:calc(12px + env(safe-area-inset-bottom,0px)); z-index:30; font:inherit; font-size:12.5px; cursor:pointer;
  background:rgba(25,23,21,.9); color:var(--ink-2); border:1px solid var(--line); border-radius:999px; padding:7px 14px}
.snd[aria-pressed="true"]{color:var(--accent-2); border-color:var(--accent)}

/* ---------- 비교형 문장 ---------- */
.sentence select{font-family:"Gowun Batang",serif; font-size:17px; padding:8px 10px; background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:2px; max-width:100%}
.sentence .me{color:var(--accent-2); font-weight:700}

/* ---------- 교사용 화면 (학생 화면과 다른 밝은 관리 화면) ---------- */
.tapp{position:fixed; inset:0; z-index:60; overflow:auto; background:#EEF0EC; color:#1D2320;
  font-family:"Noto Sans KR",system-ui,sans-serif; font-size:14px; line-height:1.6; color-scheme:light;
  padding:max(16px, env(safe-area-inset-top,0px)) 16px 40px}
.tapp *{box-sizing:border-box}
.tin{max-width:1100px; margin:0 auto; display:grid; gap:16px}
.thead{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:space-between; padding-bottom:12px; border-bottom:2px solid #1D2320}
.thead h2{font-family:"Noto Sans KR",sans-serif; font-weight:700; font-size:20px; letter-spacing:0}
.thead .tag{font-size:11px; letter-spacing:.14em; color:#5B6660; font-weight:700}
.tbtn{font:inherit; font-size:13.5px; cursor:pointer; border:1px solid #9AA59F; background:#fff; color:#1D2320; padding:8px 14px; border-radius:6px}
.tbtn:hover{border-color:#1F5C4A}
.tbtn.main{background:#1F5C4A; border-color:#1F5C4A; color:#fff; font-weight:700}
.tbtn:disabled{opacity:.5; cursor:default}
.tcard{background:#fff; border:1px solid #D3D9D5; border-radius:8px; padding:14px 16px}
.tgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px}
.tstat b{display:block; font-size:24px; font-variant-numeric:tabular-nums}
.tstat span{font-size:12px; color:#5B6660}
.tfilters{display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center}
.tfilters label{font-size:13px; color:#3B4540; display:flex; gap:6px; align-items:center}
.tfilters select,.tfilters input[type=text],.tfilters input[type=password],.tfilters input[type=url]{font:inherit; font-size:13.5px; padding:7px 9px; border:1px solid #B7C0BB; border-radius:6px; background:#fff; color:#1D2320}
.twrap{overflow-x:auto; background:#fff; border:1px solid #D3D9D5; border-radius:8px}
table.tt{border-collapse:collapse; width:100%; min-width:880px; font-size:13px}
table.tt th{position:sticky; top:0; background:#F6F7F5; text-align:left; font-weight:700; color:#3B4540; padding:8px 10px; border-bottom:1px solid #D3D9D5; white-space:nowrap}
table.tt td{color:#1D2320; font-size:13px; padding:8px 10px; border-bottom:1px solid #EBEEEC; vertical-align:top}
table.tt td.num{font-variant-numeric:tabular-nums; white-space:nowrap}
table.tt td.w{font-weight:700; color:#1F5C4A; white-space:nowrap}
table.tt td.r{min-width:320px; max-width:520px}
table.tt tr.old td{color:#8A948F}
.tnote{font-size:12.5px; color:#5B6660}
.terr{color:#A23B2A; font-size:13.5px}
.tlink{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.tlink code{font-size:12px; background:#F1F3F1; padding:6px 8px; border-radius:6px; word-break:break-all; user-select:all}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }
/* 명세 기반 그림 65종 */
.art{aspect-ratio:16/9;object-fit:cover;height:auto;animation:kb 14s ease-out both}
.frame{border:1px solid #65503b;border-radius:7px}
.frame::after{background:linear-gradient(180deg,transparent 62%,rgba(14,13,12,.74))}
.ico.painted-icon{width:28px;height:28px;object-fit:contain;border-radius:6px;background:white;stroke:none;vertical-align:middle}
.chip .ico.painted-icon{width:20px;height:20px;border-radius:4px}
.meter .lab{width:auto;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.meter{flex-wrap:wrap}.meters{grid-template-columns:1fr 1fr 1.3fr}
.year-art{margin:0 0 18px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 12px}
.year-art summary{cursor:pointer;font-size:13px;color:var(--accent-2)}.year-art[open] summary{margin-bottom:12px}
.historical-portrait{margin:16px 0 20px}.historical-portrait img{max-width:100%;height:auto;display:block;border:1px solid var(--accent);border-radius:5px}.historical-portrait figcaption{font-size:12px;color:var(--muted);margin-top:6px}
@media(max-width:600px){.meters{grid-template-columns:1fr}.frame .cap{left:12px;right:12px}.frame .ttl{font-size:21px}.frame .yr{font-size:11px}}
@media(prefers-reduced-motion:reduce){.art{animation:none!important}}
.student-entry input{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;width:180px;max-width:100%;letter-spacing:.12em}.student-entry input[aria-invalid="true"]{border-color:#cf7462}

<script>
var DATA = {"stages":[{"year":"1592년 4월","short":"1592.4","news":"일본군이 부산에 올라왔다. 부산진과 동래성이 무너지고, 임금이 한양을 떠났다."},{"year":"1592년 가을","short":"1592.가을","news":"바다에서는 이순신의 수군이 이겼다고 한다. 곳곳에서 의병이 일어났다."},{"year":"1593년","short":"1593","news":"조·명 연합군이 평양성을 되찾았다. 권율이 행주산성에서 이겼다."},{"year":"1594년","short":"1594","news":"명과 일본이 휴전 협상을 하고 있다. 큰 싸움은 멈췄다."},{"year":"1597년","short":"1597","news":"협상이 깨지고 일본군이 다시 쳐들어왔다(정유재란)."}],"endNews":"도요토미 히데요시가 죽었다. 노량 해전을 끝으로 7년 전쟁이 끝났다(1598).","src":{"famine":{"t":"백성들은 밭 갈고 씨 뿌리지 못하여 거의 다 굶어 죽었다. …… 아침에 일어나 보니 여기저기 쓰러져 죽은 자가 꽤 많았다.","c":"『대동야승』 재조번방지 (쉬운 말로 옮김)"},"combs":{"t":"“일본군은 얼레빗, 명군은 참빗” ― 명군이 참빗으로 쓸어 가듯 빼앗아 갔다는 뜻이다.","c":"교과서 주제31 「전쟁 속 조선인의 삶」"},"myeoncheon":{"t":"적을 목 벤 자, 곡식을 바친 자, 작은 공이 있는 자에게는 벼슬 문서나 노비에서 풀어 주는 문서, 군역을 면해 주는 문서를 주었다.","c":"『선조실록』 1592년 11월 2일 (쉬운 말로 옮김)"},"uibyeong":{"t":"비록 크게 이긴 싸움은 없었지만 (의병이) 민심을 얻어서 나라의 명맥은 이에 힘입어 유지할 수 있었다.","c":"『선조수정실록』 1592년 6월"},"captiveLow":{"t":"일본으로 끌려간 조선인 중 기술자나 성리학을 공부한 양반은 그나마 우대받았지만, 낮은 신분 사람들은 노동을 강요받았다. 자기 힘으로 돌아오는 것은 거의 불가능했다.","c":"교과서 주제31 「일본으로 끌려간 조선인」"},"captiveWoman":{"t":"일본에 끌려간 여성들은 남성보다 활동이 자유롭지 못했기 때문에 양반 여성도 혼자서는 조선으로 돌아올 수 없었다.","c":"교과서 주제31 「여성에게도 가혹했던 전쟁」"},"potter":{"t":"일본으로 끌려간 조선인 이삼평은 일본 아리타 지역에 자리를 잡아 도자기 신으로 불리며 일본 도자기 산업의 시조가 됐다.","c":"교과서 주제31 「왜란이 남긴 것」"},"kim":{"t":"명을 침략하려는 의도로 (일본이) 명분 없는 전쟁을 일으킨 것은 잘못됐다고 생각했다.","c":"김충선, 『모하당문집』 (교과서 주제31)"},"nobiFire":{"t":"임금이 도성을 떠나자 난민이 먼저 장례원과 형조를 불태웠다. 두 관청에 공사 노비의 문서가 있었기 때문이다.","c":"『선조수정실록』 1592년 4월 (쉬운 말로 옮김)"},"farmland":{"t":"전쟁이 끝난 뒤 조선 정부가 파악한 농경지(결 수)는 전쟁 전보다 크게 줄어 있었다.","c":"교과서 주제31 「임진왜란 이후 경지 면적 변화」"},"hoyeon":{"t":"진주성을 함락시키고 돌아갈 때, 12~13세로 보이는 어느 관인의 아들이 붙잡혀 왔다. 나오시게공이 불쌍하게 여겨 데리고 있다가 귀국할 때 함께 데려왔다. 그는 글씨를 능숙하게 썼다.","c":"『직무공보』 (노성환, 「일본 사가의 조선포로 홍호연에 관한 연구」, 2010에서 재인용, 쉬운 말로 옮김)"},"yeolnyeo":{"t":"선비 손봉남의 아내는 왜군이 몰려오자, 욕보이지 않기 위해 품에 어린아이를 안고 강물에 몸을 던졌다.","c":"『동국신속삼강행실도』 「열녀도」 (교과서 주제31)"},"womenReturn":{"t":"여성들은 신분을 불문하고 자력으로는 거의 귀환할 수 없었다. …… 몰래 사신이 지나는 길옆에 숨어 있다가 행렬에 뛰어들어 돌아온 여성도 있 람","src":"womenReturn","img":"japan_house","text":["여러 해 뒤 조선 사절이 와서 끌려온 사람들을 데려간다는 소식을 들었다.","그러나 나는 일본에서 낳은 아이를 두고 갈 수 없었다. 사절을 찾아가 부모님이 살아 계신지만 묻고, 돌아서서 울었다."]},{"when":{"flags":["captive"]},"chance":0.3,"k":"E","title":"사절을 따라 돌아온 사람","src":"womenReturn","img":"e_return_ship","text":["전쟁이 끝나고 여러 해 뒤, 조선 사절이 일본에 왔다. 나는 사절이 지나는 길옆에 숨어 있다가 행렬로 뛰어들었다.","그렇게 조선 땅을 다시 밟았다. 그러나 돌아온 사람을 반기는 눈길만 있는 것은 아니었다."]},{"when":{"flags":["captive"]},"k":"B","title":"옛 이름을 지킨 사람","src":"captiveWoman","text":["나는 일본에서 살았지만 조선에서 쓰던 이름을 잊지 않으려 애썼다.","그러나 여자 혼자서는 돌아갈 길을 찾을 수 없었다."],"img":"japan_house"},{"k":"C","title":"조선에 남은 사람","src":"captiveWoman","text":["나는 조선에 남았다.","전쟁이 끝난 뒤, 함께 피란길에 올랐던 이웃 여러 사람이 바다 건너로 끌려갔다는 소식을 들었다."],"img":"home_end"}],"reveals":[{"when":{"flags":["s_girl","captive","baptized"],"alive":true},"key":"julia","name":"오타 줄리아","real":true,"alias":["줄리아"],"bio":["오타 줄리아는 임진왜란 때 일본으로 끌려간 조선 소녀이다. 일본 장수 고니시 유키나가의 집안에서 자라며 약을 다루는 법을 배웠고, 천주교 세례를 받아 ‘줄리아’라는 이름을 얻었다.","고니시가 몰락한 뒤(1600) 도쿠가와 이에야스의 시녀가 되었으나, 막부가 천주교를 금지하자 신앙을 버리지 않아 이즈 지방의 섬들로 유배되었다고 전해진다.","뒤에 풀려나 오사카와 나가사키에서 살았다고 전하며, 1622년 선교사의 편지가 그에 관한 마지막 기록이다. 나가사키에는 조선인 천주교 신자들이 모여 살았고, 1610년에는 스스로 돈을 모아 작은 성당을 세웠다고 한다."],"uncertain":"고향과 조선 이름, 붙잡힌 곳, 유배된 까닭, 세상을 떠난 곳은 기록마다 달라 확실하지 않다.","src":"captiveWoman"},{"when":{"flags":["river"]},"key":"son","name":"손봉남의 아내","real":true,"alias":["손봉남"],"bio":["교과서에 실린 『동국신속삼강행실도』 「열녀도」에는 ‘선비 손봉남의 아내’가 왜군이 몰려오자 욕을 당하지 않으려고 어린아이를 품에 안은 채 강물에 몸을 던졌다고 적혀 있다.","『동국신속삼강행실도』는 전쟁이 끝난 뒤 나라에서 충신·효자·열녀의 이야기를 모아 펴낸 책이다. 나라는 이런 죽음을 ‘정절을 지킨 본보기’로 칭찬하고 널리 알렸다.","기록에 남은 것은 그의 이름이 아니라 ‘손봉남의 아내’라는 말뿐이다. 정희득의 어머니와 아내처럼 붙잡히기 전에 스스로 목숨을 끊은 양반 여성이 적지 않았다. 이는 전쟁의 폭력과 함께, 여성에게 목숨보다 ‘정절’을 앞세우게 한 사회의 모습을 보여 준다."],"uncertain":"그의 이름, 나이, 고향, 이 일이 일어난 해와 장소는 기록에 없어 알 수 없다. 게임에서는 정유재란(1597) 때의 일로 설정했다.","src":"yeolnyeo"}],"reveal":{"name":"이름이 남지 않은 양반 여성","real":false,"alias":["여성","양반","딸","아내"],"bio":["당신은 양반 집안의 여성이었지만 이름은 기록에 남지 않았습니다. 이 시대 여성은 ‘누구의 딸’, ‘누구의 아내’로만 적히는 일이 많았습니다.","전쟁 속 여성은 일본군에게 목 gang","name":"강항","real":true,"alias":["강항"],"bio":["강항(1567~1618)은 1593년 과거에 합격해 벼슬을 한 성리학자다. 1597년 정유재란 때 고향 영광에서 가족과 함께 배를 타고 바다로 피란했다. 아버지가 탄 배와 헤어져 찾으러 가다가 일본군 배를 만나 바다에 뛰어들었지만, 건져져 붙잡혔다. 이때 아이들이 물에 빠져 목숨을 잃었다.","일본 시코쿠의 오즈로 끌려간 그는 탈출하려다 다시 붙잡히기도 했다. 일본군은 옷차림을 보고 그를 관인(벼슬아치)으로 여겨 죽이지 않았다고 한다. 그는 시를 짓고 책을 써서 팔아 돈을 모았고, 교토 후시미에서 일본 학자 후지와라 세이카 등과 사귀며 도움을 받았다.","1600년 영주의 허락을 얻어 가족과 함께 조선으로 돌아온 그는 포로 생활과 일본의 사정을 기록한 『간양록』을 남겼다."],"uncertain":"강항이 일본 성리학에 끼친 영향이 얼마나 컸는지는 연구자마다 평가가 다르다.","src":"yangbanCaptive"}],"reveal":{"name":"이름이 남지 않은 선비","real":false,"alias":["선비","양반"],"bio":["당신은 선비였지만 이름은 기록에 남지 않았습니다.","전쟁 속 양반 남성의 삶도 여러 갈래였습니다. 곽재우처럼 재산을 털어 의병장이 된 사람도, 강항처럼 피란하다가 일본으로 끌려간 사람도, 이름 없이 싸우다 죽거나 가족을 잃은 사람도 있었습니다.","일본으로 끌려간 양반 남성은 글을 짓거나 유학 지식을 알려 주는 일을 요구받아 하층민보다는 나은 대우를 받기도 했지만, 고향으로 돌아오기는 쉽지 않았습니다."],"uncertain":"","src":"yangbanCaptive"},"img":"study"},{"id":"farmer","num":5,"status":"농민","place":"경상도 상주","age":"서른두 살","family":["어머니","아내","아들","딸"],"food":3,"health":5,"intro":["나는 상주에서 남의 땅을 빌려 농사짓는 농민이다.","올봄에는 보리가 잘 익었다. 이대로라면 올해는 굶지 않을 것 같았다."],"stages":[{"title":"일본군이 온다","text":["일본군이 부산에 올라왔다는 소문이 돈다. 며칠 뒤면 상주까지 온다고 한다.","관아에서는 남자들에게 군사로 나오라고 한다. 보리는 아직 논에 있다."],"choices":[{"label":"가족을 데리고 산으로 숨는다","res":{"text":"보리를 두고 산으로 올라갔다. 멀리 우리 마을에서 연기가 올랐다.","fx":{"food":-1},"place":"상주 뒷산"}},{"label":"관아의 부름에 따라 군사로 나간다","risk":"위험할 수 있다","chance":0.5,"win":{"text":"상주의 싸움은 금방 무너졌다. 나는 겨우 살아서 가족이 숨은 산으로 도망쳤다.","fx":{"health":-1},"place":"상주 뒷산"},"lose":{"text":"관군이 흩어질 때 칼에 베였다. 피를 흘리며 산으로 기어 올라갔다.","fx":{"health":-2},"place":"상주 뒷산"}},{"label":"보리를 거두려고 집에 남는다","risk":"운에 달렸다","chance":0.4,"win":{"text":"일본군이 우리 마을을 비껴갔다. 보리를 거두어 산으로 옮겼다.","fx":{"food":1},"place":"상주 뒷산"},"lose":{"text":"일본군이 마을에 들이닥쳤다. 도망치다 어머니를 잃었다.","fx":{"family":-1,"health":-1},"lose":"어머니","place":"상주 뒷산"}}],"urgent":true,"img":"village_burn"},{"title":"의병장이 왔다","rumor":"uibyeong","text":["산골 마을에 의병장이 왔다. “가만히 앉아서 죽기를 기다리겠는가!”","이 동네 지리를 아는 사람이 필요하다고 한다."],"choices":[{"label":"의병에 hy","text":["조선에서 새 포로들이 끌려왔다는 소식이 들린다.","나는 장수 집안에서 글공부를 이어 가고 있다. 붓을 들면 고향 생각이 조금 잊힌다."]},{"when":{"flags":["captive"]},"title":"바다 건너온 사람들","img":"sea_captive","text":["조선에서 새 포로들이 끌려왔다는 소식이 들린다.","나는 여전히 남의 집 일을 한다. 새로 온 사람들 가운데 고향 사람이 있을까?"]}],"text":["일본군이 다시 쳐들어왔다. 이번에는 사람을 잡아간다는 소문이 돈다."],"choices":[{"when":{"flags":["kato"]},"label":"머리를 깎고 스님이 된다","res":{"text":"머리를 깎고 새 이름을 받았다. 이제 나는 이 나라 절의 스님이다.","flag":"monk","status":"스님","hist":"yeo"}},{"when":{"flags":["captive"]},"label":"새로 온 조선 사람들에게 고향 소식을 묻는다","risk":"운에 달렸다","chance":0.4,"win":{"text":"고향 근처에서 온 사람을 만났다. 가족이 살아 있을지도 모른다고 했다. 그러나 확실한 것은 아무것도 없다.","flag":"news"},"lose":{"text":"아는 사람은 아무도 없었다. 고향 소식은 끊겼다.","fx":{"health":-1}}},{"when":{"flags":["nabe"]},"label":"하루도 빠짐없이 붓을 든다","res":{"text":"붓을 놓지 않았다. 글씨의 시작과 끝에 힘이 들어간 나만의 글씨가 생겼다.","flag":"calligrapher","hist":"hoyeon"}},{"when":{"flags":["captive"],"notflags":["kato","nabe"]},"label":"주인집 일에 매달린다","res":{"text":"일을 잘하자 주인이 조금 너그러워졌다. 배는 덜 고팠다.","fx":{"food":1}}},{"when":{"notflags":["captive"]},"label":"가족과 산골 깊이 숨는다","risk":"운에 달렸다","chance":0.5,"win":{"text":"가족과 함께 겨울을 넘겼다.","fx":{"health":-1}},"lose":{"text":"붙잡혔다. 가족과 흩어져 바다를 건넜다.","flag":"captive","place":"일본","status":"포로가 된 아이","apart":true}},{"when":{"notflags":["captive"]},"label":"의병 진영에서 글 쓰는 일을 돕는다","res":{"text":"격문과 장부를 쓰며 의병을 도왔다. 우리 식구 몫은 줄었다.","fx":{"food":-1},"flag":"uibyeong"}}],"img":"village_burn"}],"endings":[{"when":{"flags":["nabe","calligrapher"]},"k":"A","title":"바다 건너의 서예가","src":"hoyeon","text":["나는 일본에서 글씨로 이름을 날렸다. 절과 신사에 내 글씨가 걸렸다.","일본의 무사가 되어 가정을 꾸렸다. 그래도 쉰 살이 넘어 쓴 글씨책 끝에는 내 이름 앞에 ‘조선 서생’이라고 적었다."],"img":"calligraphy"},{"when":{"flags":["captive","monk"]},"k":"M","title":"바다 건너의 스님","src":"yeo","img":"jtemple","text":["나는 일본 절의 스님이 되었고, 마침내 큰 절을 맡는 주지가 되었다.","어느 날 조선의 아버지가 보낸 편지가 닿았다. 나는 돌아가게 해 달라고 영주에게 빌었지만, 끝내 허락을 받지 못했다."]},{"when":{"flags":["captive"]},"k":"B","title":"작은 배를 잊지 않은 사람","src":"captiveMass","text":["나는 일본에서 남은 삶을 살았다. 조선말은 점점 잊혀 갔다.","어린 나이에 끌려온 아이들은 돌아가기가 더욱 어려웠다. 그래도 작은 배에 실려 바다를 건너온 그날만은 잊지 않았다."],"img":"sea_captive"},{"k":"C","title":"폐허 속의 붓","src":"famine","text":["나는 조선에 남았다. 진주성은 무너졌고 돌아오지 못한 사람이 많았다.","나는 살아남은 사람들을 위해 편지와 제문을 써 주며 어른이 되었다."],"img":"home_end"}],"reveals":[{"when":{"flags":["nabe","calligrapher"],"alive":true},"key":"hoyeon","name":"홍호연 (洪浩然)","real":true,"alias":["홍호연","호연"],"bio":["홍호연은 1593년 제2차 진주성 전투 무렵 일본군에게 붙잡힌 아이다. 기록에는 그가 바위틈(동굴)에 숨어 있다가 발견되었고, 그때 큰 붓을 들고 있었다고 적혀 있다.","일본 사가의 장수 나베시마 나오시게가 그를 일본으로 데려갔다. 이미 시와 서예에 능했던 그는 능력을 인정받아 나오시게와 그 아들 가쓰시게 곁에서 일했고, 녹봉과 공부 지원을 받아 교토에서도 공부했다. 비슷한 처지의 여대남과도 교류했다고 한다.","그는 사가를 대표하는 서예가가 되었고, ‘조각배의 뜻을 잊지 않는다(扁舟意不忘)’는 글씨를 남겼다. 늙어서 귀국 허락을 받고 길을 떠났지만, 주군 가쓰시게가 붙잡아 두라고 명하여 되돌아와야 했다. 그는 끝내 조선으로 돌아오지 못했다.","1657년 주군 가쓰시게가 세상을 떠나자, 그도 일본 무사의 풍습에 따라 뒤따라 목숨을 끊었다(순사). 가족에게 남긴 마지막 글은 ‘참을 인(忍)’ 자였다. 일본에서 가문이 이어지려면 참고 견뎌야 한다는 뜻으로 읽힌다."],"uncertain":"붙잡힐 때 나이는 10세(김경태), 12세, ‘12~13세로 보인다’(『직무공보』) 등으로 자료마다 다르다. 숨어 있던 곳도 ‘바위틈’, ‘동굴’로 다르게 전한다. ‘호연’이 본래 이름인지, 아버지의 신분도 확실하지 않다.","src":"hoyeon"},{"when":{"flags":["kato","monk"],"alive":true},"key":"yeo","name":"여대남 (余大男)","real":true,"alias":["여대남","대남"],"bio":["여대남은 경상도 하동의 보현암에서 공부하던 아이였다. 1593년 7월 가토 기요마사의 군대에 붙잡혔는데, 그가 시문을 짓는 모습을 본 기요마사는 보통 사람이 아니라고 여겨 일본으로 데려갔다.","구마모토 혼묘지의 주지 일진이 그를 데리고 여러 절에서 공부하게 했고, 여대남은 뒷날 혼묘지의 주지가 되었다.","1620년, 조선에 있던 아버지가 보낸 편지가 그에게 닿았다. 그는 ‘28년 동안 드린 기도가 응답했다’며 기뻐하고 영주에게 귀국을 허락해 달라고 청했다. 그러나 끝내 허락을 받지 못했고, 편지도 더 주고받지 못하게 되었다."],"uncertain":"붙잡힌 해(1592년 또는 1593년)와 나이(12세 또는 13세), 혼묘지 주지가 된 해(1609년 또는 1612년), 아버지의 이름은 자료마다 다르게 전한다. 김경태의 책은 편지를 더 주고받지 못하게 되었다고 쓰지만, 그 뒤에도 편지가 오갔다는 자료가 있다. 아버지가 1615년에 죽었다는 족보 기록 때문에 편지를 의심하는 견해도 있다.","src":"yeo"}],"reveal":{"name":"이름이 남지 않은 아이","real":false,"alias":["아이"],"bio":["당신의 이름은 기록에 남지 않았습니다.","전쟁 속 아이들은 어른보다 먼저 굶주림과 병에 쓰러졌고, 많은 아이가 붙잡혀 일본으로 끌려갔습니다. 어린 나이에 끌려간 아이들은 돌아오기가 더욱 어려웠습니다.","홍호연과 여대남처럼 글재주 덕분에 이름을 남긴 아이는 아주 드문 경우였습니다."],"uncertain":"","src":"captiveMass"},"img":"s_boy_home"}],"img":{"calligraphy":"images/calligraphy.jpg","cave" function startTimer(box, choices){

  box.innerHTML = "";
  var num = h("span",{text:"15"});
  var bar = h("i");
  box.appendChild(h("div",{class:"lbl"},[ h("span",{text:"긴박한 순간 · 서둘러 고르세요"}), num ]));
  box.appendChild(h("div",{class:"bar"},[bar]));

    var left = Math.max(0, total - (Date.now() - t0)), sec = Math.ceil(left / 1000);

function tView(){
  var rows = T.rows.slice().sort(function(a,b){ return a.time < b.time ? 1 : -1; });
  if(T.latest){ var seen = {}; rows = rows.filter(function(x){ if(seen[x.sid]) return false; seen[x.sid] = 1; return true; }); }
  if(T.cls) rows = rows.filter(function(x){ return String(x.sid).slice(0,3) === T.cls; });
  if(T.q){ var q = T.q; rows = rows.filter(function(x){ return (x.sid + x.name + x.word + (x.word2||"") + (x.compare||"") + x.role).indexOf(q) >= 0; }); }
  return rows.sort(function(a,b){ return String(a.sid) < String(b.sid) ? -1 : String(a.sid) > String(b.sid) ? 1 : (a.time < b.time ? 1 : -1); });
}

/* 외부 라이브러리 없이 .xlsx 만들기 (zip 저장 방식 + 시트 XML) */
var CRC = (function(){ var t = [], c, n, k; for(n=0;n<256;n++){ c = n; for(k=0;k<8;k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b){ var c = 0xFFFFFFFF; for(var i=0;i<b.length;i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zip(files){
  var enc = new TextEncoder(), parts = [], cd = [], off = 0;
  function u16(v){ return [v & 255, (v >>> 8) & 255]; }
  function u32(v){ return [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255]; }
  files.forEach(function(f){
    var name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
    var head = [].concat(u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(0), u16(0x21), u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0));
    parts.push(new Uint8Array(head), name, data);
    cd.push([].concat(u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0x21), u32(crc), u32(data.length), u32(data.length),
      u16(name.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(off)), name);
    off += head.length + name.length + data.length;
  });
  var cdSize = 0;
  cd.forEach(function(x, i){ if(i % 2 === 0){ parts.push(new Uint8Array(x)); cdSize += x.length; } else { parts.push(x); cdSize += x.length; } });
  parts.push(new Uint8Array([].concat(u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length), u32(cdSize), u32(off), u16(0))));
  return new Blob(parts, {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
function xesc(s){ return String(s == null ? "" : s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function colName(i){ var s = ""; i += 1; while(i > 0){ var m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
function makeXlsx(head, rows, widths){
  var all = [head].concat(rows), x = [];
  all.forEach(function(r, ri){
    x.push('<row r="' + (ri+1) + '">');
    r.forEach(function(v, ci){
      var ref = colName(ci) + (ri+1), sty = ri === 0 ? ' s="1"' : ' s="2"';
      if(typeof v === "number" && isFinite(v)) x.push('<c r="' + ref + '"' + sty + '><v>' + v + '</v></c>');
      else x.push('<c r="' + ref + '"' + sty + ' t="inlineStr"><is><t xml:space="preserve">' + xesc(v) + '</t></is></c>');
    });
    x.push('</row>');
  });
  var cols = '<cols>' + widths.map(function(w, i){ return '<col min="' + (i+1) + '" max="' + (i+1) + '" width="' + w + '" customWidth="1"/>'; }).join("") + '</cols>';
  var X = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  return zip([
    {name:"[Content_Types].xml", data: X + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'},
    {name:"_rels/.rels", data: X + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:"xl/workbook.xml", data: X + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="답안" sheetId="1" r:id="rId1"/></sheets></workbook>'},
    {name:"xl/_rels/workbook.xml.rels", data: X + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'},
    {name:"xl/styles.xml", data: X + '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="맑은 고딕"/></font><font><b/><sz val="11"/><name val="맑은 고딕"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE3EAE6"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'},
    {name:"xl/worksheets/sheet1.xml", data: X + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>' + cols + '<sheetData>' + x.join("") + '</sheetData><autoFilter ref="A1:' + colName(head.length-1) + all.length + '"/></worksheet>'}
  ]);
}
function downloadXlsx(rows){
  return new Promise(function(res){
    var head = ["학번","이름","모둠","자리","내 인물","내 인물에게 ○○","비교한 인물","그 인물에게 △△","왜냐하면","글자 수","결말 코드","결말","실제와 같은 순간(★)","게임 기록","받은 시각"];
    var body = rows.map(function(x){ return [String(x.sid), x.name, x.group ? Number(x.group) : "", x.seat ? Number(x.seat) : "", x.role, x.word, x.compare || "", x.word2 || "",
      x.reason, String(x.reason||"").length, x.code, x.ending, Number(x.hist)||0, x.log, x.time]; });
    var blob = makeXlsx(head, body, [9,9,6,6,18,16,18,16,70,8,9,20,10,60,19]);
    var d = new Date(), stamp = d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0");
    var a = document.createElement("a"), u = URL.createObjectURL(blob);
    a.href = u; a.download = "나의7년1592_답안_" + stamp + ".xlsx"; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(u); a.parentNode.removeChild(a); }, 1500);
    res(rows.length);
  });
}
